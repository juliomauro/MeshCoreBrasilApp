name: Debug APK (manual)

on:
  workflow_dispatch:

jobs:
  build_debug_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-debugapk-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-debugapk-

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK to the project's normalized filename
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d "'\"" | cut -d'+' -f1)
          OUT="meshcorebrasilapp-${VERSION}-android-debug.apk"
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-debug.apk "build/dist/$OUT"
          echo "filename=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.rename.outputs.filename }}
          path: build/dist/${{ steps.rename.outputs.filename }}
          if-no-files-found: error
